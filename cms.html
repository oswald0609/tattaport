<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CMS — SHOTA INOUE Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=MuseoModerno:wght@200;300;400;500&family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#181919;
  --panel:#2a2b2b;
  --panel-2:#323333;
  --accent:#50F0D2;
  --accent-2:#3bcfb3;
  --danger:#f04650;
  --text:#E1E2E2;
  --text-mid:rgba(225,226,226,.68);
  --text-dim:rgba(225,226,226,.42);
  --border:rgba(225,226,226,.12);
  --ff-disp:'MuseoModerno',sans-serif;
  --ff-sm:'Bricolage Grotesque',sans-serif;
  --ff-jp:'Noto Sans JP',sans-serif;
  --eoe:cubic-bezier(0.16,1,0.3,1);
}
html,body{background:var(--bg);color:var(--text);font-family:var(--ff-jp);min-height:100vh}
body{padding-bottom:6rem}

/* HEADER */
.cms-header{
  background:var(--panel);
  padding:1.4rem 2rem;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:50;
}
.cms-title{
  font-family:var(--ff-disp);font-weight:300;
  font-size:1.4rem;letter-spacing:.18em;
  color:var(--accent);text-transform:uppercase;
}
.header-actions{display:flex;gap:.7rem;align-items:center}

/* LAYOUT */
.cms-body{
  max-width:1200px;margin:2rem auto;
  padding:0 2rem;
  display:grid;grid-template-columns:280px 1fr;gap:2rem;
}

/* SIDEBAR */
.sidebar{
  background:var(--panel);
  border-radius:8px;padding:1.2rem;
  position:sticky;top:6rem;
  height:fit-content;max-height:calc(100vh - 8rem);
  overflow-y:auto;
}
.sidebar h3{
  font-family:var(--ff-sm);font-weight:500;font-size:11px;
  letter-spacing:.18em;color:var(--text-dim);text-transform:uppercase;
  margin-bottom:.8rem;padding-left:.4rem;
}
.cat-list{list-style:none;display:flex;flex-direction:column;gap:.2rem;margin-bottom:.5rem}
.cat-row{
  display:flex;align-items:center;gap:.4rem;
}
.cat-item{
  flex:1;
  background:none;border:none;
  padding:.6rem .7rem;text-align:left;
  font-family:var(--ff-jp);font-size:13px;color:var(--text);
  border-radius:4px;cursor:pointer;
  transition:background .15s;
  display:flex;align-items:center;gap:.5rem;
}
.cat-item:hover{background:var(--panel-2)}
.cat-item.active{background:var(--panel-2);color:var(--accent);font-weight:500}
.cat-item .count{
  font-family:var(--ff-sm);font-size:10px;color:var(--text-dim);
  margin-left:auto;
}
.cat-icon-btn{
  background:none;border:none;color:var(--text-dim);
  font-size:13px;width:22px;height:22px;
  cursor:pointer;border-radius:3px;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s,color .15s;
}
.cat-icon-btn:hover{background:var(--panel-2);color:var(--accent)}
.cat-icon-btn.danger:hover{color:var(--danger)}

.sidebar-section{margin-bottom:1.5rem}

.work-list{list-style:none;display:flex;flex-direction:column;gap:.15rem}
.work-list-item{
  display:flex;align-items:center;gap:.4rem;
}
.work-btn{
  flex:1;
  background:none;border:1px solid transparent;
  padding:.55rem .7rem;text-align:left;
  font-family:var(--ff-jp);font-size:12px;color:var(--text-mid);
  border-radius:4px;cursor:pointer;
  transition:all .15s;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.work-btn:hover{background:var(--panel-2);color:var(--text)}
.work-btn.active{
  background:var(--panel-2);color:var(--accent);
  border-color:var(--accent);
}

/* CONTENT */
.content{
  background:var(--panel);
  border-radius:8px;
  padding:2rem;
}
.content-empty{
  text-align:center;padding:5rem 2rem;
  color:var(--text-dim);font-size:13px;
}

.section{margin-bottom:2.4rem}
.section-title{
  font-family:var(--ff-sm);font-weight:500;font-size:11px;
  letter-spacing:.18em;color:var(--accent);text-transform:uppercase;
  margin-bottom:1rem;padding-bottom:.5rem;
  border-bottom:1px solid var(--border);
}

/* FORM */
.field{margin-bottom:1rem}
.field-label{
  display:block;
  font-family:var(--ff-sm);font-size:11px;
  letter-spacing:.06em;color:var(--text-dim);text-transform:uppercase;
  margin-bottom:.4rem;
}
.field input,.field textarea,.field select{
  width:100%;
  background:var(--bg);
  border:1px solid var(--border);
  color:var(--text);
  padding:.65rem .8rem;border-radius:4px;
  font-family:var(--ff-jp);font-size:13px;
  transition:border-color .15s;
}
.field input:focus,.field textarea:focus,.field select:focus{
  outline:none;border-color:var(--accent);
}
.field textarea{min-height:90px;resize:vertical;line-height:1.7}

.field-row{
  display:grid;grid-template-columns:1fr 1fr;gap:1rem;
}

/* BUTTONS */
.btn{
  display:inline-flex;align-items:center;gap:.5rem;
  font-family:var(--ff-sm);font-weight:500;font-size:11px;
  letter-spacing:.12em;text-transform:uppercase;
  padding:.65rem 1.2rem;border-radius:4px;
  cursor:pointer;border:1px solid transparent;
  transition:all .2s;
  background:var(--panel-2);color:var(--text);
}
.btn:hover{background:#3a3b3b}
.btn-primary{background:var(--accent);color:var(--bg)}
.btn-primary:hover{background:var(--accent-2)}
.btn-ghost{background:none;border-color:var(--border);color:var(--text-mid)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);background:none}
.btn-danger{background:var(--danger);color:var(--text)}
.btn-danger:hover{background:#c8323c}
.btn-sm{padding:.4rem .8rem;font-size:10px}

/* IMAGES — detailページと同じ列構成で編集する */
.images-grid{display:flex;flex-direction:column;gap:1rem;margin-top:1rem}
.cms-image-row{display:grid;gap:1rem;align-items:start}
.cms-image-row.cols-1{grid-template-columns:1fr}
.cms-image-row.cols-2{grid-template-columns:1fr 1fr}
.cms-image-row.cols-3{grid-template-columns:1fr 1fr 1fr}
.cms-image-row.incomplete{display:flex;justify-content:center}
.cms-image-row.cols-2.incomplete > *{width:calc((100% - 1rem) / 2)}
.cms-image-row.cols-3.incomplete > *{width:calc((100% - 2rem) / 3)}
.cms-image-cell,.cms-scroll-slide{position:relative;min-width:0;background:var(--bg);border:1px solid var(--border)}
.cms-image-cell.dragging,.cms-scroll-slide.dragging{opacity:.4}
.cms-image-cell.drag-over,.cms-scroll-slide.drag-over{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.cms-scroll-block.dragging{opacity:.4}
.cms-drop-zone{height:26px;position:relative;display:flex;align-items:center;justify-content:center;cursor:copy;flex-shrink:0}
.cms-drop-zone::before{content:'';position:absolute;left:0;right:0;top:50%;border-top:1px dashed rgba(225,226,226,.25)}
.cms-drop-zone::after{content:'この位置へブロックを移動';position:relative;background:var(--panel);padding:0 .65rem;color:var(--text-dim);font:10px var(--ff-sm);letter-spacing:.08em;opacity:.7}
.cms-drop-zone.drag-over::before{border-color:var(--accent);border-width:2px}
.cms-drop-zone.drag-over::after{color:var(--accent);opacity:1}
.cms-image-cell img,.cms-image-cell video,.cms-scroll-slide img,.cms-scroll-slide video{width:100%;height:auto;display:block}
.cms-image-tools{position:absolute;right:6px;bottom:6px;display:flex;gap:4px;align-items:center;z-index:2}
.cms-image-tools button,.cms-scroll-tools button{background:rgba(0,0,0,.72);color:var(--text);border:1px solid var(--border);height:27px;border-radius:3px;cursor:pointer;padding:0 8px;font-family:var(--ff-sm);font-size:10px}
.cms-image-tools button:hover,.cms-scroll-tools button:hover{border-color:var(--accent);color:var(--accent)}
.cms-image-tools button[data-action="del"]:hover{border-color:var(--danger);color:var(--danger)}
.cms-image-tools select{background:rgba(0,0,0,.72);color:var(--text);border:1px solid var(--border);font:10px var(--ff-sm);height:27px;border-radius:3px;padding:0 4px;cursor:pointer}
.cms-image-badge{position:absolute;top:6px;left:6px;background:var(--accent);color:var(--bg);font:600 9px var(--ff-sm);letter-spacing:.1em;padding:3px 7px;border-radius:2px;text-transform:uppercase;z-index:1}
.cms-scroll-block{position:relative;overflow:hidden;border:1px solid var(--border)}
.cms-scroll-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.cms-scroll-track::-webkit-scrollbar{display:none}
.cms-scroll-slide{flex:0 0 100%;scroll-snap-align:start;border:0;border-right:1px solid var(--border)}
.cms-scroll-tools{position:absolute;left:6px;bottom:6px;display:flex;gap:4px;z-index:3}
.cms-scroll-count{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.72);color:var(--accent);font:10px var(--ff-sm);letter-spacing:.1em;padding:4px 7px;border-radius:2px;z-index:3}
.img-upload{
  display:flex;align-items:center;justify-content:center;min-height:120px;
  background:var(--bg);border:2px dashed var(--border);border-radius:4px;cursor:pointer;
  font-family:var(--ff-sm);font-size:11px;letter-spacing:.1em;color:var(--text-dim);text-transform:uppercase;transition:all .2s;
}
.img-upload button{background:none;border:0;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;padding:1.5rem;width:100%}
.img-upload:hover{
  border-color:var(--accent);
  color:var(--accent);
  background:rgba(80,240,210,.05);
}
/* Profile / Home BG用サムネイル（詳細画像レイアウトとは独立） */
.img-card{position:relative;aspect-ratio:1/1;background:var(--bg);border:1px solid var(--border);border-radius:4px;overflow:hidden;cursor:grab}
.img-card.dragging{opacity:.4}
.img-card.drag-over{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.img-card img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.img-card .img-actions{position:absolute;top:6px;right:6px;display:flex;gap:4px;opacity:0;transition:opacity .2s}
.img-card:hover .img-actions{opacity:1}
.img-card .img-actions button{background:rgba(0,0,0,.7);color:var(--text);border:none;width:26px;height:26px;border-radius:3px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.img-card .img-actions button:hover{background:rgba(240,70,80,.85)}

/* TOAST */
.toast{
  position:fixed;bottom:2rem;left:50%;
  transform:translateX(-50%) translateY(80px);
  background:var(--accent);color:var(--bg);
  padding:.8rem 1.4rem;border-radius:4px;
  font-family:var(--ff-sm);font-weight:500;font-size:12px;
  letter-spacing:.1em;text-transform:uppercase;
  z-index:1000;
  transition:transform .35s var(--eoe);
  pointer-events:none;
}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.error{background:var(--danger);color:var(--text)}

/* MODAL */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.7);
  z-index:200;display:none;align-items:center;justify-content:center;
  padding:2rem;
}
.modal-bg.open{display:flex}
.modal{
  background:var(--panel);border-radius:8px;
  padding:2rem;max-width:420px;width:100%;
}
.modal h3{
  font-family:var(--ff-disp);font-weight:300;font-size:1.1rem;
  letter-spacing:.1em;text-transform:uppercase;color:var(--accent);
  margin-bottom:1.2rem;
}
.modal .field-row{margin-top:.5rem}
.modal-actions{
  display:flex;gap:.6rem;justify-content:flex-end;
  margin-top:1.5rem;
}

/* Help */
.help-text{
  font-size:11px;color:var(--text-dim);
  line-height:1.6;margin-top:.4rem;
}

/* DnD — リスト行（カテゴリ・作品）共通 */
.cat-row.dnd-dragging,
.work-list-item.dnd-dragging{opacity:.35}
.cat-row.dnd-over,
.work-list-item.dnd-over{
  outline:2px solid var(--accent);
  border-radius:4px;
  background:rgba(80,240,210,.06);
}
/* ドラッグハンドル */
.dnd-handle{
  display:flex;align-items:center;justify-content:center;
  width:18px;flex-shrink:0;
  color:var(--text-dim);font-size:13px;
  cursor:grab;user-select:none;
  padding:0 2px;
}
.dnd-handle:active{cursor:grabbing}

/* RESPONSIVE */
@media(max-width:880px){
  .cms-body{grid-template-columns:1fr;padding:0 1rem}
  .sidebar{position:static;max-height:none}
  .field-row{grid-template-columns:1fr}
  .cms-header{padding:1.2rem 1rem}
  .header-actions{gap:.4rem}
  .btn{padding:.55rem .9rem}
  .images-grid,.cms-image-row{gap:.5rem}
  .cms-image-row.cols-2{gap:.4rem}
  .cms-image-row.cols-3{gap:.3rem}
  .cms-image-row.cols-2.incomplete > *{width:calc((100% - .4rem) / 2)}
  .cms-image-row.cols-3.incomplete > *{width:calc((100% - .6rem) / 3)}
}
/* =========================================
   TOP TITLE GRAPHIC
   ========================================= */

.top-title-slots{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:1rem;
}

.top-title-slot{
  padding:1.2rem;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:4px;
}

.top-title-preview{
  position:relative;
  min-height:160px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:.8rem;
  padding:1.2rem;
  background:#121313;
  border:1px solid var(--border);
}

.top-title-preview img{
  display:block;
  max-width:100%;
  max-height:160px;
  object-fit:contain;
}

.top-title-empty{
  min-height:160px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:.8rem;
  border:1px dashed var(--border);
  color:var(--text-dim);
  font-size:12px;
}

@media(max-width:880px){
  .top-title-slots{
    grid-template-columns:1fr;
  }
}
</style>

<script>
/* ─── データ構造 ──────────────────────────
WORKS_DATA: [
  { cat: 'Branding', items: [
    {
      id: 'sotoya-rebrand',
      tag: 'Branding',
      title: 'タイトル',
      desc: '説明文',
      lead: 'リード文(詳細ページ)',
      meta: { client, year, artDirection, design, direction, tools },
      images: [ { src: 'data:image/...', cols: 1 }, ... ]
    }
  ]},
  ...
]
*/

const STORAGE_KEY = 'worksData';
const PROFILE_KEY = 'profileData';
const LOGO_KEY = 'logoData';
const HOMEBG_KEY = 'homeBgData';
const TOPTITLE_KEY = 'topTitleData';

let DATA = [];
let PROFILE = { images: [] };
let LOGO = { src: '' };
let HOME_BG = { images: [] };

/* TOPのSHOTA / INOUE作字SVG */
let TOP_TITLE = {
  shota: {
    src:'',
    type:''
  },
  inoue: {
    src:'',
    type:''
  }
};

let currentCat = null;
let currentItem = null;
let currentPage = null;    // 'profile' | 'logo' | 'homebg' | 'toptitle' | null

/* ─── UTIL ─── */
function uid(){
  return 'w_' + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);
}
function toast(msg, type){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('error', type === 'error');
  t.classList.add('show');
  clearTimeout(toast._tid);
  toast._tid = setTimeout(() => t.classList.remove('show'), 2000);
}

/* ─── IndexedDB ヘルパー ─────────────────────────────────────
   DB名: portfolioCMS  ストア名: store  キー: string
   値: any (JSON-serializable)
   localStorage は使わず全データをここに保存する
   ──────────────────────────────────────────────────────── */
const IDB_NAME = 'portfolioCMS';
const IDB_VER  = 1;
const IDB_STORE = 'store';
let _db = null;

function openDB(){
  if(_db) return Promise.resolve(_db);
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, IDB_VER);
    req.onupgradeneeded = e => {
      e.target.result.createObjectStore(IDB_STORE);
    };
    req.onsuccess = e => { _db = e.target.result; resolve(_db); };
    req.onerror   = e => reject(e.target.error);
  });
}

async function idbGet(key){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror   = e => reject(e.target.error);
  });
}

async function idbSet(key, value){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    const req = tx.objectStore(IDB_STORE).put(value, key);
    req.onsuccess = () => resolve();
    req.onerror   = e => reject(e.target.error);
  });
}

async function idbGetAll(){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readonly');
    const store = tx.objectStore(IDB_STORE);
    const result = {};
    const reqKeys = store.getAllKeys();
    reqKeys.onsuccess = () => {
      const keys = reqKeys.result;
      let pending = keys.length;
      if(pending === 0){ resolve(result); return; }
      keys.forEach(k => {
        const r = store.get(k);
        r.onsuccess = () => { result[k] = r.result; if(--pending === 0) resolve(result); };
        r.onerror   = e => reject(e.target.error);
      });
    };
    reqKeys.onerror = e => reject(e.target.error);
  });
}

/* ─── ストレージ ─── */
async function load(){
  try {
    const raw = await idbGet(STORAGE_KEY);
    const pRaw = await idbGet(PROFILE_KEY);
    const lRaw = await idbGet(LOGO_KEY);
    const hRaw = await idbGet(HOMEBG_KEY);
    const tRaw = await idbGet(TOPTITLE_KEY);

    let migrated = false;

    /* WORKS */
    if(raw){
      DATA = raw;

      DATA.forEach(group => {
        group.items.forEach(item => {
          if(!item.images) item.images = [];
          if(!item.meta) item.meta = {};
          if(!('lead' in item)) item.lead = item.desc || '';
        });
      });
    } else {
      const lsRaw = localStorage.getItem(STORAGE_KEY);

      if(lsRaw){
        DATA = JSON.parse(lsRaw);

        DATA.forEach(group => {
          group.items.forEach(item => {
            if(!item.images) item.images = [];
            if(!item.meta) item.meta = {};
            if(!('lead' in item)) item.lead = item.desc || '';
          });
        });

        migrated = true;
      } else {
        DATA = getDefaultData();
      }
    }

    /* PROFILE */
    if(pRaw){
      PROFILE = pRaw;
    } else {
      const lsPRaw = localStorage.getItem(PROFILE_KEY);

      if(lsPRaw){
        PROFILE = JSON.parse(lsPRaw);
        migrated = true;
      }
    }

    if(!PROFILE.images) PROFILE.images = [];

    /* LOGO */
    if(lRaw){
      LOGO = lRaw;
    } else {
      const lsLRaw = localStorage.getItem(LOGO_KEY);

      if(lsLRaw){
        LOGO = JSON.parse(lsLRaw);
        migrated = true;
      }
    }

    if(!LOGO.src) LOGO.src = '';

    /* HOME BG */
    if(hRaw){
      HOME_BG = hRaw;
    } else {
      const lsHRaw = localStorage.getItem(HOMEBG_KEY);

      if(lsHRaw){
        HOME_BG = JSON.parse(lsHRaw);
        migrated = true;
      }
    }

    if(!HOME_BG.images) HOME_BG.images = [];

    /* TOP TITLE */
    if(tRaw){
      TOP_TITLE = tRaw;
    } else {
      const lsTRaw = localStorage.getItem(TOPTITLE_KEY);

      if(lsTRaw){
        TOP_TITLE = JSON.parse(lsTRaw);
        migrated = true;
      }
    }

    if(!TOP_TITLE || typeof TOP_TITLE !== 'object'){
      TOP_TITLE = {};
    }

    if(!TOP_TITLE.shota){
      TOP_TITLE.shota = {
        src:'',
        type:''
      };
    }

    if(!TOP_TITLE.inoue){
      TOP_TITLE.inoue = {
        src:'',
        type:''
      };
    }

    /* 旧localStorageからの移行が発生した場合 */
    if(migrated){
      await save(true);

      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(PROFILE_KEY);
      localStorage.removeItem(LOGO_KEY);
      localStorage.removeItem(HOMEBG_KEY);
      localStorage.removeItem(TOPTITLE_KEY);

      toast('localStorage からデータを移行しました');
    }

  } catch(e){
    console.error('load error:', e);

    DATA = getDefaultData();
    PROFILE = { images: [] };
    LOGO = { src: '' };
    HOME_BG = { images: [] };

    TOP_TITLE = {
      shota: {
        src:'',
        type:''
      },
      inoue: {
        src:'',
        type:''
      }
    };
  }
}
 

async function save(silent){
  try {
    await idbSet(STORAGE_KEY, DATA);
    await idbSet(PROFILE_KEY, PROFILE);
    await idbSet(LOGO_KEY, LOGO);
    await idbSet(HOMEBG_KEY, HOME_BG);
    await idbSet(TOPTITLE_KEY, TOP_TITLE);

    if(!silent){
      updateStorageUsage();
    }
  } catch(e){
    console.error('save error:', e);

    if(!silent){
      toast('保存に失敗しました: ' + (e.message || e), 'error');
    }
  }
}

async function updateStorageUsage(){
  const el = document.getElementById('storageUsage');
  if(!el) return;
  try {
    /* StorageManager API で実際の IndexedDB 使用量を取得 */
    if(navigator.storage && navigator.storage.estimate){
      const est = await navigator.storage.estimate();
      const used = est.usage  || 0;
      const quot = est.quota  || 0;
      const usedMb = (used / 1024 / 1024).toFixed(1);
      const quotMb = (quot / 1024 / 1024 / 1024).toFixed(1); /* GB */
      const pct = quot > 0 ? Math.round((used / quot) * 100) : 0;
      let color = 'var(--text-dim)';
      if(pct > 80) color = 'var(--danger)';
      else if(pct > 60) color = '#f0c84a';
      el.style.color = color;
      el.textContent = `STORAGE: ${usedMb}MB / ${quotMb}GB (${pct}%)`;
    } else {
      el.textContent = 'STORAGE: IndexedDB';
      el.style.color = 'var(--text-dim)';
    }
  } catch(e){
    el.textContent = 'STORAGE: IndexedDB';
    el.style.color = 'var(--text-dim)';
  }
}

/* ─── カテゴリ ─── */
function renderCategories(){
  const list = document.getElementById('catList');
  list.innerHTML = '';
  DATA.forEach(group => {
    const li = document.createElement('li');
    li.className = 'cat-row';
    li.dataset.cat = group.cat;
    li.innerHTML = `
      <span class="dnd-handle" title="ドラッグして並び替え">⠿</span>
      <button class="cat-item ${group.cat === currentCat ? 'active' : ''}" data-cat="${escapeAttr(group.cat)}">
        ${escapeHtml(group.cat)} <span class="count">${group.items.length}</span>
      </button>
      <button class="cat-icon-btn" data-action="rename-cat" data-cat="${escapeAttr(group.cat)}" title="Rename">✎</button>
      <button class="cat-icon-btn danger" data-action="delete-cat" data-cat="${escapeAttr(group.cat)}" title="Delete">×</button>
    `;
    list.appendChild(li);

    /* ── DnD: ハンドルを掴んだときだけ li を draggable にする ── */
    const handle = li.querySelector('.dnd-handle');
    handle.addEventListener('mousedown', () => { li.draggable = true; });
    li.addEventListener('dragstart', e => {
      li.classList.add('dnd-dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', group.cat);
      window._dndCatFrom = group.cat;
    });
    li.addEventListener('dragend', () => {
      li.draggable = false;
      li.classList.remove('dnd-dragging');
      list.querySelectorAll('.cat-row').forEach(r => r.classList.remove('dnd-over'));
    });
    li.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      if(window._dndCatFrom !== group.cat){
        list.querySelectorAll('.cat-row').forEach(r => r.classList.remove('dnd-over'));
        li.classList.add('dnd-over');
      }
    });
    li.addEventListener('dragleave', () => li.classList.remove('dnd-over'));
    li.addEventListener('drop', e => {
      e.preventDefault();
      li.classList.remove('dnd-over');
      const fromCat = window._dndCatFrom;
      const toCat = group.cat;
      if(fromCat === toCat) return;
      const fromIdx = DATA.findIndex(g => g.cat === fromCat);
      const toIdx   = DATA.findIndex(g => g.cat === toCat);
      if(fromIdx < 0 || toIdx < 0) return;
      const [moved] = DATA.splice(fromIdx, 1);
      DATA.splice(toIdx, 0, moved);
      save();
      renderCategories();
      renderWorks();
    });
  });

  list.querySelectorAll('.cat-item').forEach(b => {
    b.addEventListener('click', () => {
      currentCat = b.dataset.cat;
      currentItem = null;
      currentPage = null;
      document.querySelectorAll('.cat-item:not([data-cat])').forEach(btn => btn.classList.remove('active'));
      renderCategories();
      renderWorks();
      renderContent();
    });
  });
  list.querySelectorAll('[data-action="rename-cat"]').forEach(b => {
    b.addEventListener('click', () => openCatModal(b.dataset.cat));
  });
  list.querySelectorAll('[data-action="delete-cat"]').forEach(b => {
    b.addEventListener('click', () => deleteCategory(b.dataset.cat));
  });
}

function openCatModal(catName){
  const modal = document.getElementById('catModal');
  const title = document.getElementById('catModalTitle');
  const input = document.getElementById('catName');
  if(catName){
    title.textContent = 'Rename Category';
    input.value = catName;
    input.dataset.original = catName;
  } else {
    title.textContent = 'New Category';
    input.value = '';
    delete input.dataset.original;
  }
  modal.classList.add('open');
  setTimeout(() => input.focus(), 50);
}
function closeCatModal(){
  document.getElementById('catModal').classList.remove('open');
}
function saveCatModal(){
  const input = document.getElementById('catName');
  const name = input.value.trim();
  if(!name){ toast('名前を入力してください','error'); return; }
  const original = input.dataset.original;
  if(original){
    // rename
    if(name !== original && DATA.find(g => g.cat === name)){
      toast('同名のカテゴリが既に存在します','error'); return;
    }
    const g = DATA.find(g => g.cat === original);
    g.cat = name;
    if(currentCat === original) currentCat = name;
    g.items.forEach(it => { if(it.tag === original) it.tag = name; });
  } else {
    // create
    if(DATA.find(g => g.cat === name)){
      toast('同名のカテゴリが既に存在します','error'); return;
    }
    DATA.push({cat:name, items:[]});
    currentCat = name;
  }
  save();
  closeCatModal();
  renderCategories();
  renderWorks();
  renderContent();
  toast('保存しました');
}
function deleteCategory(catName){
  const g = DATA.find(g => g.cat === catName);
  confirmAction(`カテゴリ「${catName}」と${g.items.length}件の作品を削除します。よろしいですか？`, () => {
    DATA = DATA.filter(g => g.cat !== catName);
    if(currentCat === catName){ currentCat = null; currentItem = null; }
    save();
    renderCategories();
    renderWorks();
    renderContent();
    toast('削除しました');
  });
}

function renderWorks(){
  const list = document.getElementById('workList');
  const header = document.getElementById('worksHeader');
  list.innerHTML = '';
  if(!currentCat){
    header.textContent = 'Works';
    return;
  }
  header.textContent = `Works — ${currentCat}`;
  const group = DATA.find(g => g.cat === currentCat);
  group.items.forEach((item, idx) => {
    const li = document.createElement('li');
    li.className = 'work-list-item';
    li.dataset.idx = idx;
    li.innerHTML = `
      <span class="dnd-handle" title="ドラッグして並び替え">⠿</span>
      <button class="work-btn ${currentItem && currentItem.item === item ? 'active' : ''}" data-idx="${idx}">
        ${escapeHtml(item.title || '(無題)')}
      </button>
      <button class="cat-icon-btn danger" data-action="delete-work" data-idx="${idx}" title="Delete">×</button>
    `;
    list.appendChild(li);

    /* ── DnD: ハンドルを掴んだときだけ li を draggable にする ── */
    const handle = li.querySelector('.dnd-handle');
    handle.addEventListener('mousedown', () => { li.draggable = true; });
    li.addEventListener('dragstart', e => {
      li.classList.add('dnd-dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', String(idx));
      window._dndWorkFrom = idx;
    });
    li.addEventListener('dragend', () => {
      li.draggable = false;
      li.classList.remove('dnd-dragging');
      list.querySelectorAll('.work-list-item').forEach(r => r.classList.remove('dnd-over'));
    });
    li.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      if(window._dndWorkFrom !== idx){
        list.querySelectorAll('.work-list-item').forEach(r => r.classList.remove('dnd-over'));
        li.classList.add('dnd-over');
      }
    });
    li.addEventListener('dragleave', () => li.classList.remove('dnd-over'));
    li.addEventListener('drop', e => {
      e.preventDefault();
      li.classList.remove('dnd-over');
      const fromIdx = window._dndWorkFrom;
      const toIdx = idx;
      if(fromIdx === toIdx) return;
      const [moved] = group.items.splice(fromIdx, 1);
      group.items.splice(toIdx, 0, moved);
      /* currentItem の参照を更新 */
      if(currentItem){
        const newIdx = group.items.indexOf(currentItem.item);
        if(newIdx >= 0) currentItem.idx = newIdx;
      }
      save();
      renderWorks();
    });
  });

  list.querySelectorAll('.work-btn').forEach(b => {
    b.addEventListener('click', () => {
      const idx = parseInt(b.dataset.idx);
      currentItem = { catName: currentCat, item: group.items[idx], idx };
      renderWorks();
      renderContent();
    });
  });
  list.querySelectorAll('[data-action="delete-work"]').forEach(b => {
    b.addEventListener('click', () => {
      const idx = parseInt(b.dataset.idx);
      const item = group.items[idx];
      confirmAction(`作品「${item.title}」を削除します。よろしいですか？`, () => {
        group.items.splice(idx, 1);
        if(currentItem && currentItem.item === item){ currentItem = null; }
        save();
        renderCategories();
        renderWorks();
        renderContent();
        toast('削除しました');
      });
    });
  });
}

function renderLogoContent(root){
  const hasLogo = !!LOGO.src;
  root.innerHTML = `
    <div class="section">
      <div class="section-title">Site Logo</div>
      <div class="help-text" style="margin-bottom:1rem">
        ・オープニングアニメーション・ナビ・フッター・ファビコン全てに使用されます<br>
        ・正方形のPNG / SVG（背景透過）推奨<br>
        ・1枚のみ登録可能（再アップロードで上書き）
      </div>
      <div class="images-grid" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">
        ${hasLogo ? `
          <div class="img-card" style="background:#1d1e1e;border:1px solid var(--border)">
            <img src="${LOGO.src}" alt="" style="object-fit:contain;padding:1rem;width:100%;height:100%">
            <div class="img-actions">
              <button data-action="logo-del">×</button>
            </div>
          </div>
        ` : ''}
        <label class="img-upload">
          ＋ ${hasLogo ? 'Replace' : 'Upload'}
          <input type="file" accept="image/*" id="logoUpload" style="display:none">
        </label>
      </div>
    </div>
  `;

  const upInput = document.getElementById('logoUpload');
  if(upInput){
    upInput.addEventListener('change', async e => {
      const f = e.target.files[0];
      if(!f) return;
      try {
        let dataUrl;
        // SVG/PNGはそのまま読み込む（透過・画質維持）
        if(f.type === 'image/svg+xml' || f.type === 'image/png'){
          dataUrl = await readFileAsDataURL(f);
        } else {
          // JPGなどはリサイズ
          dataUrl = await readImageAsResizedDataURL(f, 512, 0.92);
        }
        LOGO.src = dataUrl;
        save();
        renderLogoContent(root);
        updateLogoStatus();
        toast('ロゴをアップロードしました');
      } catch(err){
        toast('読み込み失敗','error');
      }
    });
  }

  const delBtn = root.querySelector('[data-action="logo-del"]');
  if(delBtn){
    delBtn.addEventListener('click', () => {
      LOGO.src = '';
      save();
      renderLogoContent(root);
      updateLogoStatus();
      toast('ロゴを削除しました');
    });
  }
}

  if(el) el.textContent = LOGO.src ? '✓' : '—';

      HOME_BG.images.splice(idx, 1);

      updateHomeBgCount();

    card.addEventListener('drop', e => {
      e.preventDefault();
      card.classList.remove('drag-over');
      const fromIdx = window._draggingHomeBgIdx;
      if(fromIdx === idx) return;

  if(!el) return;

    TOP_TITLE.inoue = {
      src:'',
      type:''
    };

      src:'',
      type:''

    <div class="section">
      <div class="section-title">Top Title Graphic</div>

      <div class="help-text" style="margin-bottom:1.2rem">
        ・TOPページの「SHOTA」「INOUE」を別々に管理します<br>
        ・SVG / PNG / WebP / JPG を登録できます<br>
        ・SVGは背景透過・アウトライン化済み・余白少なめを推奨します<br>
        ・画像が未登録の場合は、従来のテキスト表示に戻ります
      </div>

      <div class="top-title-slots">
        ${makeSlot('shota', 'SHOTA')}
        ${makeSlot('inoue', 'INOUE')}

  root.querySelectorAll('[data-title-upload]').forEach(input => {
    input.addEventListener('change', async e => {
      const file = e.target.files && e.target.files[0];
      const key = e.target.dataset.titleUpload;

      if(!file || !key) return;

      try {
        const src = await readFileAsDataURL(file);

        TOP_TITLE[key] = {
          src,
          type: file.type || (
            file.name.toLowerCase().endsWith('.svg')
              ? 'image/svg+xml'
              : ''
          )
        };

        await save();

        updateTopTitleStatus();
        renderTopTitleContent(root);

        toast(`${key.toUpperCase()} をアップロードしました`);
      } catch(err){
        console.error(err);
        toast('画像の読み込みに失敗しました', 'error');
      }

  root.querySelectorAll('[data-title-delete]').forEach(button => {

/* ─── 画像 ─── */
function renderImages(){
  const grid = document.getElementById('imagesGrid');
  if(!grid) return;
  grid.innerHTML = '';
  const it = currentItem.item;
  if(!it.images) it.images = [];
  const newScrollGroupId = () => `scroll-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
  /* 既存データの連続Scrollは、初回編集時に同じブロックIDへ移行 */
  let legacyGroupId = null;
  it.images.forEach(img => {
    if(!img.scrollGroup){ legacyGroupId = null; return; }
    if(img.scrollGroupId){ legacyGroupId = null; return; }
    legacyGroupId ||= newScrollGroupId();
    img.scrollGroupId = legacyGroupId;
    img.scrollCols = img.scrollCols || 1;
  });
  const addFiles = async (files, insertAt, scrollGroup = false, scrollGroupId = '', scrollCols = 1) => {
    const entries = [];
    for(const file of files){
      try {
        const src = isAnimatedOrVideo(file) ? await readFileAsDataURL(file) : await readImageAsResizedDataURL(file, 1400, 0.78);
        entries.push({src, cols:1, scrollGroup, scrollGroupId, scrollCols, type:file.type});
      } catch(err){ toast(`${file.name}の読み込み失敗`, 'error'); }
    }
    if(entries.length){ it.images.splice(insertAt, 0, ...entries); save(); renderImages(); toast(`${entries.length}件追加しました`); }
  };
  const media = img => (img.type || '').startsWith('video/')
    ? `<video src="${img.src}" muted loop playsinline autoplay controls></video>` : `<img src="${img.src}" alt="">`;
  const moveRange = (range, insertAt) => {
    if(!range || (insertAt >= range.start && insertAt <= range.end)) return;
    const moved = it.images.splice(range.start, range.end - range.start);
    const target = insertAt > range.start ? insertAt - moved.length : insertAt;
    it.images.splice(target, 0, ...moved);
    save(); renderImages();
  };
  const getDragRange = idx => {
    const image = it.images[idx];
    if(!image || !image.scrollGroup) return {start:idx, end:idx + 1};
    const groupId = image.scrollGroupId;
    let start = idx, end = idx + 1;
    while(start > 0 && it.images[start - 1].scrollGroup && it.images[start - 1].scrollGroupId === groupId) start--;
    while(end < it.images.length && it.images[end].scrollGroup && it.images[end].scrollGroupId === groupId) end++;
    return {start, end};
  };
  const attachCellEvents = (cell, idx) => {
    cell.draggable = true;
    cell.addEventListener('dragstart', () => { cell.classList.add('dragging'); window._draggingRange = getDragRange(idx); });
    cell.addEventListener('dragend', () => { cell.classList.remove('dragging'); grid.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over')); });
    cell.addEventListener('dragover', e => { e.preventDefault(); cell.classList.add('drag-over'); });
    cell.addEventListener('dragleave', () => cell.classList.remove('drag-over'));
    cell.addEventListener('drop', e => {
      e.preventDefault(); cell.classList.remove('drag-over');
      moveRange(window._draggingRange, idx);
    });
    cell.querySelector('[data-action="del"]').addEventListener('click', e => { e.stopPropagation(); it.images.splice(idx, 1); save(); renderImages(); });
    const select = cell.querySelector('[data-action="cols"]');
    select.addEventListener('click', e => e.stopPropagation());
    select.addEventListener('change', e => {
      const img = it.images[idx];
      if(e.target.value.startsWith('scroll-')){
        const scrollCols = parseInt(e.target.value.split('-')[1]);
        const groupId = img.scrollGroupId || newScrollGroupId();
        img.scrollGroup = true; img.scrollGroupId = groupId; img.scrollCols = scrollCols; img.cols = 1;
        /* 同じScrollブロック内の画像は幅設定も揃える */
        it.images.forEach(entry => { if(entry.scrollGroupId === groupId){ entry.scrollGroup = true; entry.scrollCols = scrollCols; } });
      } else {
        img.scrollGroup = false; img.cols = parseInt(e.target.value);
        delete img.scrollGroupId; delete img.scrollCols;
      }
      save(); renderImages();
    });
  };
  const makeCell = (img, idx, scroll = false) => {
    const cell = document.createElement('div'); cell.className = scroll ? 'cms-scroll-slide' : 'cms-image-cell';
    cell.innerHTML = `${media(img)}${idx === 0 ? '<span class="cms-image-badge">Thumb</span>' : ''}<div class="cms-image-tools"><button data-action="del" title="削除">×</button><select data-action="cols"><option value="1" ${(!img.scrollGroup && img.cols === 1) ? 'selected' : ''}>1列</option><option value="2" ${(!img.scrollGroup && img.cols === 2) ? 'selected' : ''}>2列</option><option value="3" ${(!img.scrollGroup && img.cols === 3) ? 'selected' : ''}>3列</option><option value="scroll-1" ${img.scrollGroup && (img.scrollCols || 1) === 1 ? 'selected' : ''}>Scroll 1列</option><option value="scroll-2" ${img.scrollGroup && img.scrollCols === 2 ? 'selected' : ''}>Scroll 2列</option><option value="scroll-3" ${img.scrollGroup && img.scrollCols === 3 ? 'selected' : ''}>Scroll 3列</option></select></div>`;
    attachCellEvents(cell, idx); return cell;
  };
  let i = 0, row = null, currentCols = null;
  const getRow = (cols, startIndex) => {
    if(currentCols !== cols || (row && row.children.length >= cols)){
      row = document.createElement('div'); row.className = `cms-image-row cols-${cols}`;
      row.dataset.insertAt = startIndex;
      grid.appendChild(row); currentCols = cols;
    }
    return row;
  };
  while(i < it.images.length){
    const image = it.images[i];
    if(image.scrollGroup){
      const start = i, groupId = image.scrollGroupId, cols = Math.max(1, Math.min(3, image.scrollCols || 1));
      const block = document.createElement('div'), track = document.createElement('div');
      block.className = 'cms-scroll-block'; track.className = 'cms-scroll-track';
      while(i < it.images.length && it.images[i].scrollGroup && it.images[i].scrollGroupId === groupId) track.appendChild(makeCell(it.images[i], i++, true));
      const insertAt = i;
      block.append(track);
      block.insertAdjacentHTML('beforeend', `<span class="cms-scroll-count">SCROLL ${cols}列 · ${i - start}枚</span><div class="cms-scroll-tools"><button type="button" class="cms-scroll-add-btn">＋ 画像を追加</button><input type="file" multiple accept="image/*,video/*,.gif,.mp4,.webm,.mov" style="display:none"></div>`);
      const input = block.querySelector('input');
      block.querySelector('.cms-scroll-add-btn').addEventListener('click', () => input.click());
      input.addEventListener('change', e => addFiles(Array.from(e.target.files || []), insertAt, true, groupId, cols));
      getRow(cols, start).appendChild(block);
      continue;
    }
    const cols = image.cols || 1;
    const targetRow = getRow(cols, i);
    do { targetRow.appendChild(makeCell(it.images[i], i)); i++; }
    while(i < it.images.length && !it.images[i].scrollGroup && (it.images[i].cols || 1) === cols && targetRow.children.length < cols);
  }
  grid.querySelectorAll('.cms-image-row.cols-2, .cms-image-row.cols-3').forEach(rowEl => {
    const cols = rowEl.classList.contains('cols-2') ? 2 : 3;
    if(rowEl.children.length < cols) rowEl.classList.add('incomplete');
  });
  /* 行と行の間に、ブロック全体の移動先を示すドロップラインを置く */
  const rows = Array.from(grid.querySelectorAll('.cms-image-row'));
  const addDropZone = (insertAt, before) => {
    const zone = document.createElement('div');
    zone.className = 'cms-drop-zone';
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
    zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('drag-over'); moveRange(window._draggingRange, insertAt); });
    grid.insertBefore(zone, before);
  };
  if(rows.length){
    addDropZone(parseInt(rows[0].dataset.insertAt), rows[0]);
    rows.forEach((rowEl, idx) => addDropZone(idx + 1 < rows.length ? parseInt(rows[idx + 1].dataset.insertAt) : it.images.length, idx + 1 < rows.length ? rows[idx + 1] : null));
  }
  const up = document.createElement('div');
  up.className = 'img-upload'; up.innerHTML = '<button type="button">＋ 画像を追加</button>';
  const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*,video/*,.gif,.mp4,.webm,.mov'; input.multiple = true; input.style.display = 'none';
  up.appendChild(input); grid.appendChild(up);
  up.querySelector('button').addEventListener('click', () => input.click());
  input.addEventListener('change', e => addFiles(Array.from(e.target.files || []), it.images.length));
}

/* 画像をリサイズしてBase64で保存 (WebP優先、未対応ならJPEG) */
/* GIF・動画はそのまま保存（isAnimatedOrVideo を先に確認すること） */
function isAnimatedOrVideo(file){
  /* GIF・動画ファイルはCanvas変換しない（アニメーションが消えるため）*/
  return file.type === 'image/gif'
    || file.type.startsWith('video/')
    || /\.(gif|mp4|webm|mov|avi)$/i.test(file.name);
}
function readImageAsResizedDataURL(file, maxW, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const ratio = img.width > maxW ? maxW / img.width : 1;
        const w = Math.round(img.width * ratio);
        const h = Math.round(img.height * ratio);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        /* WebPで書き出し（対応してない古いブラウザはJPEGにフォールバック） */
        let dataUrl = canvas.toDataURL('image/webp', quality);
        if(!dataUrl.startsWith('data:image/webp')){
          dataUrl = canvas.toDataURL('image/jpeg', quality);
        }
        resolve(dataUrl);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ファイルをそのままBase64で保存（SVG/PNG透過保持用） */
function readFileAsDataURL(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ZIP出力: data.json + images/ フォルダのバンドル
   画像のBase64 → 物理ファイルに変換し、JSON内のパスを書き換え */
async function exportZip(){
  if(typeof JSZip === 'undefined'){
    toast('JSZip読み込み失敗（ネット接続を確認）', 'error');
    return;
  }

  toast('ZIP生成中...');

  const zip = new JSZip();
  const imgFolder = zip.folder('images');

  const works = JSON.parse(JSON.stringify(DATA));
  const profile = JSON.parse(JSON.stringify(PROFILE));
  const logo = JSON.parse(JSON.stringify(LOGO));
  const homeBg = JSON.parse(JSON.stringify(HOME_BG));
  const topTitle = JSON.parse(JSON.stringify(TOP_TITLE));

  let imgCounter = 0;

  function processImageEntry(entry, prefix){
    if(!entry || !entry.src) return;
    if(!entry.src.startsWith('data:')) return;

    const match = entry.src.match(/^data:([^;]+);base64,(.+)$/);

    if(!match) return;

    const mime = match[1];
    const base64 = match[2];

    let ext = mime.split('/')[1]
      .replace('jpeg', 'jpg')
      .replace('svg+xml', 'svg')
      .replace('quicktime', 'mov');

    imgCounter++;

    const fileName = `${prefix}-${imgCounter}.${ext}`;

    imgFolder.file(fileName, base64, {
      base64:true
    });

    entry.src = `images/${fileName}`;
    entry.type = mime;
  }

  works.forEach(group => {
    group.items.forEach(item => {
      if(item.images){
        item.images.forEach(image => {
          processImageEntry(image, `work-${item.id}`);
        });
      }
    });
  });

  if(profile.images){
    profile.images.forEach(image => {
      processImageEntry(image, 'profile');
    });
  }

  if(homeBg.images){
    homeBg.images.forEach(image => {
      processImageEntry(image, 'homebg');
    });
  }

  if(logo.src){
    processImageEntry(logo, 'logo');
  }

  if(topTitle.shota && topTitle.shota.src){
    processImageEntry(topTitle.shota, 'top-title-shota');
  }

  if(topTitle.inoue && topTitle.inoue.src){
    processImageEntry(topTitle.inoue, 'top-title-inoue');
  }

  zip.file(
    'data.json',
    JSON.stringify(
      {
        works,
        profile,
        logo,
        homeBg,
        topTitle
      },
      null,
      2
    )
  );

  const blob = await zip.generateAsync({
    type:'blob'
  });

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');

  a.href = url;
  a.download = `portfolio-bundle-${new Date().toISOString().slice(0,10)}.zip`;

  a.click();

  URL.revokeObjectURL(url);

  toast('ZIP生成完了');
}

async function importData(file){
  const isZip = file.name.toLowerCase().endsWith('.zip');

  /* ZIP Import */
  if(isZip){
    if(typeof JSZip === 'undefined'){
      toast('JSZip読み込み失敗', 'error');
      return;
    }

    try {
      const zip = await JSZip.loadAsync(file);
      const dataFile = zip.file('data.json');

      if(!dataFile){
        toast('data.jsonがZIPに含まれていません', 'error');
        return;
      }

      const dataText = await dataFile.async('string');
      const data = JSON.parse(dataText);

      const newData = data.works || [];
      const newProfile = data.profile || { images: [] };
      const newLogo = data.logo || { src: '' };
      const newHomeBg = data.homeBg || { images: [] };

      const newTopTitle = data.topTitle || {
        shota: {
          src:'',
          type:''
        },
        inoue: {
          src:'',
          type:''
        }
      };

      if(!newTopTitle.shota){
        newTopTitle.shota = {
          src:'',
          type:''
        };
      }

      if(!newTopTitle.inoue){
        newTopTitle.inoue = {
          src:'',
          type:''
        };
      }

      async function pathToBase64(entry){
        if(!entry || !entry.src) return;
        if(entry.src.startsWith('data:')) return;

        const path = entry.src;
        const zipFile = zip.file(path);

        if(!zipFile) return;

        const base64 = await zipFile.async('base64');
        const ext = path.split('.').pop().toLowerCase();

        const mimeMap = {
          jpg:'image/jpeg',
          jpeg:'image/jpeg',
          png:'image/png',
          gif:'image/gif',
          webp:'image/webp',
          svg:'image/svg+xml',
          mp4:'video/mp4',
          webm:'video/webm',
          mov:'video/quicktime',
          avi:'video/x-msvideo'
        };

        const mime = mimeMap[ext] || `image/${ext}`;

        entry.src = `data:${mime};base64,${base64}`;
        entry.type = mime;
      }

      for(const group of newData){
        for(const item of group.items){
          if(item.images){
            for(const image of item.images){
              await pathToBase64(image);
            }
          }
        }
      }

      if(newProfile.images){
        for(const image of newProfile.images){
          await pathToBase64(image);
        }
      }

      if(newHomeBg.images){
        for(const image of newHomeBg.images){
          await pathToBase64(image);
        }
      }

      if(newLogo.src){
        await pathToBase64(newLogo);
      }

      if(newTopTitle.shota && newTopTitle.shota.src){
        await pathToBase64(newTopTitle.shota);
      }

      if(newTopTitle.inoue && newTopTitle.inoue.src){
        await pathToBase64(newTopTitle.inoue);
      }

      confirmAction('現在のデータを上書きします。よろしいですか？', async () => {
        DATA = newData;
        PROFILE = newProfile;
        LOGO = newLogo;
        HOME_BG = newHomeBg;
        TOP_TITLE = newTopTitle;

        currentCat = null;
        currentItem = null;
        currentPage = null;

        await save();

        updateProfileCount();
        updateLogoStatus();
        updateHomeBgCount();
        updateTopTitleStatus();

        renderCategories();
        renderWorks();
        renderContent();

        toast('インポート完了');
      });

    } catch(err){
      console.error(err);
      toast('ZIPの読み込みに失敗しました', 'error');
    }

    return;
  }

  /* JSON Import */
  const reader = new FileReader();

  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);

      let newData;
      let newProfile;
      let newLogo;
      let newHomeBg;
      let newTopTitle;

      /* 古いworks配列だけのJSONにも対応 */
      if(Array.isArray(data)){
        newData = data;
        newProfile = PROFILE;
        newLogo = LOGO;
        newHomeBg = HOME_BG;
        newTopTitle = TOP_TITLE;
      }

      /* 新しいJSON形式 */
      else if(data.works){
        newData = data.works;
        newProfile = data.profile || { images: [] };
        newLogo = data.logo || { src: '' };
        newHomeBg = data.homeBg || { images: [] };

        newTopTitle = data.topTitle || {
          shota: {
            src:'',
            type:''
          },
          inoue: {
            src:'',
            type:''
          }
        };
      }

      else {
        throw new Error('Invalid JSON');
      }

      if(!newTopTitle.shota){
        newTopTitle.shota = {
          src:'',
          type:''
        };
      }

      if(!newTopTitle.inoue){
        newTopTitle.inoue = {
          src:'',
          type:''
        };
      }

      confirmAction('現在のデータを上書きします。よろしいですか？', async () => {
        DATA = newData;
        PROFILE = newProfile;
        LOGO = newLogo;
        HOME_BG = newHomeBg;
        TOP_TITLE = newTopTitle;

        currentCat = null;
        currentItem = null;
        currentPage = null;

        await save();

        updateProfileCount();
        updateLogoStatus();
        updateHomeBgCount();
        updateTopTitleStatus();

        renderCategories();
        renderWorks();
        renderContent();

        toast('インポート完了');
      });

    } catch(err){
      console.error(err);
      toast('JSONの読み込みに失敗しました', 'error');
    }
  };

  reader.readAsText(file);
}

/* ─── ESCAPE ─── */
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }
